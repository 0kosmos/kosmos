<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kosmos</title>
    <script>
      // Apply the saved theme before anything is drawn, so there is no flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem("kosmos-settings-v1") || "{}");
        var t = ["dark", "dim", "grey", "light"].indexOf(s.theme) >= 0 ? s.theme : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.tone = t === "light" || t === "grey" ? "light" : "dark";
        document.documentElement.dataset.accent = s.accent || "mono";
        // Saved sidebar width, so the layout doesn't jump on start
        var w = Number(s.sidebarWidth);
        if (w >= 220 && w <= 568) document.documentElement.style.setProperty("--sidebar-w", w + "px");
        if (s.statusBar === false) document.documentElement.style.setProperty("--statusbar-h", "0px");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.tone = "dark";
        document.documentElement.dataset.accent = "mono";
      }
    </script>
    <!-- Open the connection to our Worker early, so the first request doesn't wait for it -->
    <link rel="preconnect" href="https://kosmos-api.kosmosinfo2026.workers.dev" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
