[package]
name = "kosmos"
version = "0.1.0"
description = "Kosmos"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kosmos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
discord-rich-presence = "1.1.0"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
# Talk to the page engine (WebView2): ask it to use less memory while Kosmos is hidden.
# Same versions Tauri already uses, so nothing extra is downloaded or built.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Security",                  # needed by CreateFileW (open a drive to ask what it is)
  "Win32_Storage_FileSystem",        # CreateFileW
  "Win32_System_IO",                 # DeviceIoControl (SSD / HDD / NVMe query)
  "Win32_System_SystemInformation",  # total RAM
  "Win32_System_Threading",          # which program owns a window
  "Win32_UI_WindowsAndMessaging",    # which window is in front
  "Win32_System_Diagnostics_ToolHelp", # list running programs (live game stats)
  "Win32_System_ProcessStatus",      # a program's memory use (live game stats)
  "Win32_System_Performance",        # Windows' GPU counters (live game stats)
  "Win32_System_DataExchange",       # clipboard ("send to a friend" for screenshots)
  "Win32_System_Memory",             # clipboard memory
  "Win32_UI_Shell",                  # the file-list format File Explorer uses when copying files
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
